er is a claim that has to survive its own citations</text><rect x="30" y="90" width="800" height="190" rx="10" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/><text x="48" y="116" font-size="12" fill="#a78bfa" font-weight="700" text-anchor="start">LANGGRAPH · STATE MACHINE</text><text x="812" y="116" font-size="11" fill="#8b949e" font-weight="400" text-anchor="end">question → cited answer</text><rect x="52" y="135" width="136" height="72" rx="8" fill="#0d1117" stroke="#a78bfa" stroke-width="1.8"/><text x="62" y="152" font-size="10" fill="#484f58" font-weight="700" text-anchor="start">1</text><text x="120" y="177" font-size="14" fill="#a78bfa" font-weight="700" text-anchor="middle">decompose</text><text x="120" y="196" font-size="10.5" fill="#8b949e" font-weight="400" text-anchor="middle">query sub-graphs</text><path d="M191 171 H207" fill="none" stroke="#8b949e" stroke-width="1.6" class="flow" marker-end="url(#m-8b949e)"/><rect x="210" y="135" width="136" height="72" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.8"/><text x="220" y="152" font-size="10" fill="#484f58" font-weight="700" text-anchor="start">2</text><text x="278" y="177" font-size="14" fill="#58a6ff" font-weight="700" text-anchor="middle">retrieve</text><text x="278" y="196" font-size="10.5" fill="#8b949e" font-weight="400" text-anchor="middle">multi-hop search</text><path d="M349 171 H365" fill="none" stroke="#8b949e" stroke-width="1.6" class="flow" marker-end="url(#m-8b949e)"/><rect x="368" y="135" width="136" height="72" rx="8" fill="#0d1117" stroke="#f0a030" stroke-width="1.8"/><text x="378" y="152" font-size="10" fill="#484f58" font-weight="700" text-anchor="start">3</text><text x="436" y="177" font-size="14" fill="#f0a030" font-weight="700" text-anchor="middle">rerank</text><text x="436" y="196" font-size="10.5" fill="#8b949e" font-weight="400" text-anchor="middle">cross-encoder</text><path d="M507 171 H523" fill="none" stroke="#8b949e" stroke-width="1.6" class="flow" marker-end="url(#m-8b949e)"/><rect x="526" y="135" width="136" height="72" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1.8"/><text x="536" y="152" font-size="10" fill="#484f58" font-weight="700" text-anchor="start">4</text><text x="594" y="177" font-size="14" fill="#8b949e" font-weight="700" text-anchor="middle">generate</text><text x="594" y="196" font-size="10.5" fill="#8b949e" font-weight="400" text-anchor="middle">draft answer</text><path d="M665 171 H681" fill="none" stroke="#8b949e" stroke-width="1.6" class="flow" marker-end="url(#m-8b949e)"/><rect x="684" y="135" width="136" height="72" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.8"/><text x="694" y="152" font-size="10" fill="#484f58" font-weight="700" text-anchor="start">5</text><text x="752" y="177" font-size="14" fill="#3fb950" font-weight="700" text-anchor="middle">verify</text><text x="752" y="196" font-size="10.5" fill="#8b949e" font-weight="400" text-anchor="middle">grounding check</text><text x="48" y="246" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start">comparative questions split into sub-questions · every claim is re-checked against its source citation</text><text x="48" y="266" font-size="11" fill="#484f58" font-weight="400" text-anchor="start">state is passed node to node, so each step is inspectable</text><rect x="30" y="310" width="250" height="112" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="46" y="336" font-size="14" fill="#3fb950" font-weight="700" text-anchor="start">PDF table parser</text><text x="46" y="358" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start">custom parser for 10-K / 10-Q</text><text x="46" y="376" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start">tables stay intact as units</text><rect x="46" y="390" width="218" height="22" rx="5" fill="#3fb95022" stroke="#3fb950"/><text x="155" y="405" font-size="10.5" fill="#3fb950" font-weight="700" text-anchor="middle">indexed into Qdrant</text><rect x="305" y="310" width="250" height="112" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="321" y="336" font-size="14" fill="#58a6ff" font-weight="700" text-anchor="start">Qdrant</text><text x="321" y="358" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start">vector store</text><text x="321" y="376" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start">metadata filters per filing</text><rect x="321" y="390" width="218" height="22" rx="5" fill="#58a6ff22" stroke="#58a6ff"/><text x="430" y="405" font-size="10.5" fill="#58a6ff" font-weight="700" text-anchor="middle">100% metadata isolation</text><rect x="580" y="310" width="250" height="112" rx="10" fill="#161b22" stroke="#f0a030" stroke-width="1.5"/><text x="596" y="336" font-size="14" fill="#f0a030" font-weight="700" text-anchor="start">Cross-encoder</text><text x="596" y="358" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start">reranks retrieved candidates</text><text x="596" y="376" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start">tables ranked over prose</text><rect x="596" y="390" width="218" height="22" rx="5" fill="#f0a03022" stroke="#f0a030"/><text x="705" y="405" font-size="10.5" fill="#f0a030" font-weight="700" text-anchor="middle">100% Top-4 table retrieval</text><path d="M283 366 H302" fill="none" stroke="#3fb950" stroke-width="1.6" class="flow" marker-end="url(#m-3fb950)"/><path d="M278 207 V258 H380 V308" fill="none" stroke="#58a6ff" stroke-width="1.6" class="flow" marker-end="url(#m-58a6ff)"/><text x="388" y="296" font-size="10" fill="#8b949e" font-weight="400" text-anchor="start">filtered search</text><path d="M436 207 V284 H705 V308" fill="none" stroke="#f0a030" stroke-width="1.6" class="flow" marker-end="url(#m-f0a030)"/><text x="560" y="277" font-size="10" fill="#8b949e" font-weight="400" text-anchor="start">rerank top-k</text><rect x="30" y="444" width="194" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="127" y="481" font-size="26" fill="#a78bfa" font-weight="700" text-anchor="middle">7.25 ms</text><text x="127" y="505" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle">P50 latency</text><rect x="233" y="444" width="194" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="330" y="481" font-size="26" fill="#a78bfa" font-weight="700" text-anchor="middle">17.76 ms</text><text x="330" y="505" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle">P95 latency</text><rect x="436" y="444" width="194" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="533" y="481" font-size="26" fill="#f0a030" font-weight="700" text-anchor="middle">100%</text><text x="533" y="505" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle">Top-4 table retrieval</text><rect x="639" y="444" width="194" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="736" y="481" font-size="26" fill="#58a6ff" font-weight="700" text-anchor="middle">100%</text><text x="736" y="505" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle">metadata isolation</text><text x="30" y="552" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start">FastAPI · Streamlit · Docker · AWS EC2</text><text x="830" y="552" font-size="11" fill="#484f58" font-weight="400" text-anchor="end">Aug 2026</text></svg>